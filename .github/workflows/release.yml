name: Release

# Publica um release a cada tag de versão (ex.: 1.0.1). O Obsidian exige a tag igual ao manifest, sem "v".
# Para (re)publicar uma tag antiga: Actions → Release → Run workflow → informe a tag.
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: 1.0.1)"
        required: true

permissions:
  contents: write
  # Attestations: provam que main.js e styles.css foram gerados a partir deste repositório.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::A tag $TAG não bate com a versão do manifest.json ($version). Use a tag sem \"v\"."
            exit 1
          fi

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="main.js manifest.json styles.css"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
            gh release edit "$TAG" --draft=false  # se a tag foi recriada, o GitHub deixa o release como rascunho
          else
            gh release create "$TAG" $assets --title "Brain Graph $TAG" --verify-tag --generate-notes
          fi
